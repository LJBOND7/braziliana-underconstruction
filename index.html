<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braziliana | Site em construção</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f5f0;
    font-family: Georgia, 'Times New Roman', serif;
    color: #1f2a24;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 640px; }
  .brand {
    font-size: 56px;
    letter-spacing: 2px;
    color: #14532d;
  }
  .brand span { color: #b8860b; }
  .rule {
    width: 120px;
    height: 3px;
    background: #b8860b;
    margin: 28px auto;
    border: 0;
  }
  h1 {
    font-size: 26px;
    font-weight: normal;
    margin-bottom: 10px;
  }
  .en {
    font-size: 18px;
    color: #5b6660;
    font-style: italic;
    margin-bottom: 36px;
  }
  .domain {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    color: #5b6660;
    text-transform: lowercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Brazili<span>ana</span></div>
    <hr class="rule">
    <h1>Site em constru&ccedil;&atilde;o</h1>
    <p class="en">This website is under construction. Please check back soon.</p>
    <p class="domain">braziliana.com.br</p>
  </div>
</body>
</html>
